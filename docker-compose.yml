version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_pw
      POSTGRES_DB: taskflow_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://taskflow:taskflow_dev_pw@postgres:5432/taskflow_dev

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}

      BCRYPT_COST: ${BCRYPT_COST}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Correct path based on your source:
    # src/jobs/queues/worker.ts
    command: node dist/jobs/queues/worker.js

    environment:
      NODE_ENV: development

      DATABASE_URL: postgresql://taskflow:taskflow_dev_pw@postgres:5432/taskflow_dev

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}

      BCRYPT_COST: ${BCRYPT_COST}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: